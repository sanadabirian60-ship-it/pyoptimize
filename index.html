        .section-title {

            .section-title {
                color: #93c5fd;
            }
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--secondary);
        }

        .card h3 {
            margin-top: 0;
            color: var(--secondary);
        }

        .card p {
            color: var(--muted);
            font-size: 14px;
        }

            padding: 8px 16px;

            color: white;

            text-decoration: none;
            font-size: 14px;
        }

            background: #0d5f93;
        }
