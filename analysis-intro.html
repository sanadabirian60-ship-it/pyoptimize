<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;

            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #080d19;
            color: #f1f5f9;
            line-height: 2;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: #101a2c;
            border-bottom: 1px solid #26364e;
            padding: 17px 7%;
            display: flex;

            position: sticky;
            top: 0;

        .logo {

        .hero {

            background: radial-gradient(circle at top, #12375b, #080d19 70%);
        }

        .badge {
            display: inline-block;
            border: 1px solid #0ea5e9;
            color: #38bdf8;
            border-radius: 30px;
            padding: 5px 18px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .hero h1 {
            font-size: clamp(27px, 5vw, 43px);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            color: #aab8ca;

            margin: auto;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: auto;
        }

        .content {
            padding: 60px 0;
        }

        .article-section {
            background: #111c30;
            border: 1px solid #26364e;
            border-radius: 15px;
            padding: 28px;
            margin-bottom: 25px;
        }

        .article-section h2 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .article-section h3 {
            color: #7dd3fc;
            margin: 20px 0 10px;
        }

        .article-section p {
            color: #c0ccdc;
            font-size: 15px;
        }

        .article-section ul {
            padding-right: 25px;
            color: #c0ccdc;
        }

        .article-section li {
            margin-bottom: 8px;
        }

        pre {

            text-align: left;
            overflow-x: auto;
            background: #050914;
            border: 1px solid #26364e;
            border-radius: 10px;
            padding: 20px;
            margin: 18px 0;
            color: #7dd3fc;
            font-family: Consolas, monospace;
            font-size: 13px;
            line-height: 1.8;
        }

        .note {
            background: #102a43;
            border-right: 4px solid #0ea5e9;
            padding: 17px;
            border-radius: 8px;
            color: #dbeafe;
            margin-top: 18px;
        }

        .comparison {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow: hidden;
        }

        .comparison th,
        .comparison td {
            border: 1px solid #334155;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        .comparison th {
            background: #12375b;
            color: #7dd3fc;
        }

        .comparison td {
            color: #cbd5e1;
        }

        .back {
            display: inline-block;
            background: #0284c7;
            padding: 10px 25px;
            border-radius: 9px;
            margin-top: 20px;
        }

        footer {
            background: #050914;
            border-top: 1px solid #26364e;
            padding: 25px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
        }

        @media(max-width: 650px) {
            header {
                flex-direction: column;
                gap: 12px;
            }

            .container {
                width: 92%;
            }

            .article-section {
                padding: 20px;
            }

            .comparison th,
            .comparison td {
                padding: 7px;
                font-size: 12px;
            }
